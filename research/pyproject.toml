[project]
name = "takedown-research"
version = "0.1.0"
description = "Evaluation harness for Takedown: fetches datasets and scores the Rust analyzers' CSV output with mir_eval"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "mir-eval==0.8.2",
    "numpy>=2.5.4",
    "pedalboard>=0.9.26",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
