[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/LTeder/Takedown"
authors = ["Logan Teder"]

[workspace.dependencies]
takedown-core = { path = "crates/core" }
takedown-evidence = { path = "crates/evidence" }
takedown-drums = { path = "crates/drums" }
takedown-render = { path = "crates/render" }
takedown-midi = { path = "crates/midi" }
realfft = "3.5"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: declared once so feature unification cannot lose it (core-types §2.0).
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight DSP code more than they help it.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
debug = 1

[profile.test]
opt-level = 2
